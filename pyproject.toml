[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycheck-neuron"
version = "1.0.2"
description = "32-rule static AST analyzer catching temporal lookahead bias, causal confusion, and uncertainty bugs in Python ML code. Zero dependencies."
readme = "README.md"
authors = [
    { name = "Fayo Ibrahim", email = "fayo@neuron-lab.org" },
    { name = "NEURON Team" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
]
keywords = [
    "machine-learning", "data-leakage", "temporal-bias", "lookahead-bias",
    "backtesting", "quantitative-finance", "algorithmic-trading",
    "linter", "static-analysis", "causal-inference", "time-series",
    "pandas", "sklearn", "scikit-learn", "uncertainty", "neuron",
    "ml-safety", "data-science", "feature-engineering"
]
requires-python = ">=3.7"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/neuronlabs-ai/pycheck"
Documentation = "https://github.com/neuronlabs-ai/pycheck#readme"
Repository = "https://github.com/neuronlabs-ai/pycheck"
"Bug Tracker" = "https://github.com/neuronlabs-ai/pycheck/issues"

[project.scripts]
pycheck = "pycheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycheck*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
