name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke-test CLI on examples
        run: |
          # Leaky pipeline must produce errors (exit 1)
          python -m pycheck examples/leaky_pipeline.py --quiet || true
          # Zillow example must produce errors
          python -m pycheck examples/zillow_ibuying.py --quiet || true
          # JSON output must be valid JSON
          python -m pycheck examples/leaky_pipeline.py --json | python -m json.tool > /dev/null
          # List rules
          python -m pycheck --list

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check dist contents
        run: |
          pip install twine
          python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
