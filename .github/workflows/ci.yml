name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke-test CLI on examples
        run: |
          # Leaky pipeline must produce errors (exit 1)
          python -m pycheck examples/leaky_pipeline.py --quiet || true
          # Zillow example must produce errors
          python -m pycheck examples/zillow_ibuying.py --quiet || true
          # JSON output must be valid JSON
          python -m pycheck examples/leaky_pipeline.py --json | python -m json.tool > /dev/null || true
          # List rules
          python -m pycheck --list

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check dist contents
        run: |
          pip install twine
          python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/


  wheel-install-test:
    name: Verify Wheel Clean Install & Stress Suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install built wheel in isolated environment and run stress suite
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          pip install --upgrade pip pytest
          pip install dist/*.whl
          pycheck --list
          pycheck --help
          pytest tests/stress/ -rx --tb=short
